name: Check

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # The site's packages give oxlint and knip the site's types and imports.
      - run: npm ci --prefix site
      - run: pipx install semgrep
      # The same gate the pre-push hook runs (lefthook.yml).
      - run: npm run gate
      - run: npm pack --dry-run
