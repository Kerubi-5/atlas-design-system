name: Release

# Publishes atlas-react-kit to npm via OIDC trusted publishing — no
# NPM_TOKEN, no OTP. Idempotent: it publishes only when package.json's
# version isn't already on npm, so re-runs and non-version changes are no-ops.
#
# ── One-time setup (npmjs.com, owner only) ──────────────────────────────────
# On https://www.npmjs.com/package/atlas-react-kit → Settings →
# Trusted Publisher, add a GitHub Actions publisher:
# Organization/user: Kerubi-5
# Repository: atlas-design-system
# Workflow filename: release.yml
# After that, bumping the version in package.json and merging to main
# publishes it automatically. workflow_dispatch re-runs without a new tag.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "theme.css"
      - "DESIGN_RULES.md"
      - "COMPONENTS.md"
      - "NOTICE"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; node may ship older npm.
      - name: Upgrade npm
        run: npm install -g npm@^11

      - name: Install
        run: npm ci

      # A regression must never reach npm — quality gates the publish.
      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "atlas-react-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "atlas-react-kit@${VERSION} is already on npm — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing atlas-react-kit@${VERSION}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC exchange happens automatically (id-token: write + trusted publisher).
      # --provenance signs a build attestation (public repo → shown on npm).
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance
