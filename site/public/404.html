<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found ⋅ Atlas React Kit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap"
    />
    <style>
      /*
       * Served by Vercel for unknown paths, and by the docs site for unknown
       * story or docs ids. Colors are theme.css tokens; build.test.mjs keeps
       * these values equal to theme.css.
       */
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.53 0 0);
        --border: oklch(0.922 0 0);
        --ring: oklch(0.491 0.27 292.581);
        color-scheme: light;
      }
      .dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --border: oklch(1 0 0 / 10%);
        --ring: oklch(0.75 0.14 293);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      main {
        display: grid;
        gap: 1rem;
        width: 100%;
        max-width: 32rem;
        padding: 2rem;
        border: 1px solid var(--border);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
      }
      .code {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted-foreground);
      }
      code {
        overflow-wrap: anywhere;
        padding: 0.1rem 0.3rem;
        background: var(--muted);
        color: var(--foreground);
        font-size: 0.8125rem;
      }
      a {
        color: var(--ring);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      a:hover {
        color: var(--foreground);
      }
      a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
    <script>
      // Follow the docs theme toolbar when sent here from a Storybook link,
      // otherwise the system setting.
      ;(() => {
        const theme = new URLSearchParams(location.search).get("theme")
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <main>
      <span class="brand">
        <img src="/favicon.svg" alt="" width="22" height="22" />
        Atlas React Kit
      </span>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>There is no page at <code id="missing-path">this address</code>.</p>
      <p><a href="/">Go to the Atlas React Kit home</a></p>
    </main>
    <script>
      ;(() => {
        const params = new URLSearchParams(location.search)
        document.getElementById("missing-path").textContent =
          params.get("path") ?? location.pathname
      })()
    </script>
  </body>
</html>
